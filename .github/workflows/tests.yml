name: Daymark tests

on:
  push:
    branches:
      - main
      - feature/v2.6-study-breaks
  pull_request:
    branches:
      - main

jobs:
  study-break-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
